# 设置 Gradle 命令默认使用的内存，可通过用户配置或命令行参数覆盖。
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment 参数名称和 Javadoc 配置说明：
# https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# Parchment 可用版本列表：
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17


# 环境属性

# 可用版本列表：
# https://projects.neoforged.net/neoforged/neoforge
# Minecraft 版本必须与 NeoForge 版本匹配，才能获取有效的构建工件。
minecraft_version=1.21.1

# Minecraft 版本范围可以使用任意正式发布版本作为边界。
# Snapshot、预发布版和候选发布版不保证能够正确排序，因为它们不遵循标准版本排序规则。
minecraft_version_range=[1.21.1]

# NeoForge 版本必须与 Minecraft 版本匹配。
neo_version=21.1.244

# Loader 版本范围只能使用 FML 的主版本号作为边界。
loader_version_range=[1,)


## Mod 属性

# Mod 的唯一标识符必须使用小写英文，并符合正则 [a-z][a-z0-9_]{1,63}。
# 它必须与带有 @Mod 注解的主 Mod 类中的字符串常量一致。
mod_id=simply_swords_overhaul

# Mod 面向玩家显示的可读名称。
mod_name=Simply Swords Overhaul

# Mod 使用的许可证。可参考 https://choosealicense.com/。
mod_license=MIT

# Mod 版本号。可参考 https://semver.org/。
mod_version=1.0.0

# Mod 的 group ID，只有发布为 Maven 工件时才特别重要。
# 它应当与 Mod 源码使用的基础 Java 包名一致。
# 命名约定说明：https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=net.jrdemiurge.simplyswordsoverhaul


## 网络代理（仅在直连失败时需要）

# Gradle 运行在 JVM 上，而 JVM 不读取 HTTP_PROXY / HTTPS_PROXY 环境变量，
# 默认也不读取 Windows 系统代理（java.net.useSystemProxies 默认 false）。
# 因此浏览器和 curl 能正常联网时，Gradle 仍可能报以下错误：
#   Could not download ... / Could not GET 'https://...'
#   > 这是在主机名解析时通常出现的暂时错误 (plugins.gradle.org)
# 此时需要为 Gradle 单独指定代理。以下配置默认注释，直连正常时请保持注释状态。
#
# 本文件会被提交到 Git，不要在此填写个人代理地址；
# 需要全局生效时，改在 Gradle 用户目录的 gradle.properties 中配置：
#   Windows: %GRADLE_USER_HOME%\gradle.properties（未设置该变量时为 %USERPROFILE%\.gradle\gradle.properties）
#   macOS / Linux: ~/.gradle/gradle.properties
#
# 下面的端口 7897 是 Clash / Mihomo 的默认混合端口，请改成你自己的代理端口。
# nonProxyHosts 使用以 | 分隔的正则片段，注意与 NO_PROXY 的逗号分隔格式不同。

# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# systemProp.http.nonProxyHosts=localhost|127.*|[::1]
# systemProp.https.nonProxyHosts=localhost|127.*|[::1]
